name: Release Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: kora-reclaim

jobs:
  build:
    name: Build - ${{ matrix.platform.os_name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: kora-reclaim
            name: kora-reclaim-linux-amd64
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: kora-reclaim.exe
            name: kora-reclaim-windows-amd64.exe
          - os_name: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: kora-reclaim
            name: kora-reclaim-darwin-amd64

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev pkg-config libssl-dev build-essential

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.platform.target }}

    - name: Build binary
      run: cargo build --release --locked --target ${{ matrix.platform.target }}

    - name: Rename binary
      shell: bash
      run: |
        mkdir -p dist
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} dist/${{ matrix.platform.name }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.name }}
        path: dist/${{ matrix.platform.name }}
